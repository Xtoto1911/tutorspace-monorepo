server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 10m;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location ^~ /internal/ {
    return 404;
  }

  location ^~ /api/auth/ {
    proxy_pass http://auth-service:8080;
    include /etc/nginx/proxy-headers.conf;
  }

  location ^~ /api/marketplace/ {
    proxy_pass http://marketplace-service:8081;
    include /etc/nginx/proxy-headers.conf;
  }

  location ^~ /api/subscriptions/ {
    proxy_pass http://subscription-service:8085;
    include /etc/nginx/proxy-headers.conf;
  }

  location ^~ /api/admin/notifications {
    proxy_pass http://notification-service:8083;
    include /etc/nginx/proxy-headers.conf;
  }

  location ^~ /api/notifications {
    proxy_pass http://notification-service:8083;
    include /etc/nginx/proxy-headers.conf;
  }

  location ^~ /api/public/tutors/ {
    proxy_pass http://crm-service:8082;
    include /etc/nginx/proxy-headers.conf;
  }

  location ^~ /api/client/ {
    proxy_pass http://crm-service:8082;
    include /etc/nginx/proxy-headers.conf;
  }

  location ^~ /api/tutor/ {
    proxy_pass http://crm-service:8082;
    include /etc/nginx/proxy-headers.conf;
  }

  location ^~ /api/admin/ {
    proxy_pass http://admin-service:8084;
    include /etc/nginx/proxy-headers.conf;
  }

  location ^~ /api/moderator/ {
    proxy_pass http://admin-service:8084;
    include /etc/nginx/proxy-headers.conf;
  }

  location ~ ^/main\.(css|js)$ {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
