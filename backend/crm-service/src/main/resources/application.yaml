server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: crm-service
  datasource:
    url: ${CRM_DB_URL:jdbc:postgresql://localhost:5432/crm_db}
    driver-class-name: ${CRM_DB_DRIVER:org.postgresql.Driver}
    username: ${CRM_DB_USERNAME:crm_user}
    password: ${CRM_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.tutor.*"

jwt:
  secret: ${JWT_SECRET}

app:
  notification-service-url: ${NOTIFICATION_SERVICE_URL:}

marketplace:
  service:
    url: ${MARKETPLACE_SERVICE_URL:http://localhost:18081}
